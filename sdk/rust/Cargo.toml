[package]
name = "naatre-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "Runtime-neutral Rust client types and generated operation bindings for Naatre"
repository = "https://github.com/valksor/naatre"
publish = false

[features]
default = []
generator = ["dep:sha2"]
tokio = []

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = { version = "=0.10.9", optional = true }
time = { version = "=0.3.44", features = ["formatting", "parsing"] }

[dev-dependencies]
sha2 = "=0.10.9"

[[bin]]
name = "naatre-rust-sdk-generator"
path = "src/generator_main.rs"
required-features = ["generator"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
