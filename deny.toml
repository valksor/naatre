# cargo-deny configuration: licenses and advisories gate CI (see
# .github/workflows/ci.yml, "deny" job).

[licenses]
allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    # DATA, not linked code: webpki-roots / webpki-root-certs (the Mozilla
    # root-store snapshot riding reqwest 0.13's rustls feature, which
    # object_store's S3 backend cannot avoid) ship under CDLA-Permissive-2.0.
    # It is a permissive Linux Foundation data license, reviewed as
    # DFSG-free by Debian; Fedora classifies it allowed-for-content. naatre
    # is GPL-3.0-only: if a reviewer judges this license GPL-3-incompatible,
    # the remedy is dropping the embedded roots, not re-licensing naatre.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# naatre is GPL-3.0-only, so any term of a dual "(MIT OR Apache-2.0)" license
# is compatible; we pin those crates to the MIT term. Crates that are
# "(MIT OR Apache-2.0) AND Unicode-3.0" (unicode-ident,
# unicode-normalization) are deliberately NOT clarified: their Unicode data
# license is a real requirement, not a choice.

# hash 0x0 is cargo-deny's "any hash" sentinel: the MIT text is identified by
# path, and the expression override does the pinning.

[[licenses.clarify]]
name = "thiserror"
expression = "MIT"
license-files = [{ path = "LICENSE-MIT", hash = 0x0 }]

[[licenses.clarify]]
name = "serde"
expression = "MIT"
license-files = [{ path = "LICENSE-MIT", hash = 0x0 }]

[[licenses.clarify]]
name = "serde_json"
expression = "MIT"
license-files = [{ path = "LICENSE-MIT", hash = 0x0 }]

[[licenses.clarify]]
name = "proptest"
expression = "MIT"
license-files = [{ path = "LICENSE-MIT", hash = 0x0 }]

[advisories]
version = 2
yanked = "deny"
