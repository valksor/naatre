[package]
name = "naatre-store"
description = "naatre store: SQLite metadata, content-addressed blob CAS, ephemeral snapshot storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
naatre-core = { path = "../naatre-core" }
rusqlite = { version = "0.41", features = ["bundled"] }
zstd = "0.14"
thiserror = "2"
fs2 = "0.4"
postgres = "0.19"
toml = "0.9"
# S3-compatible CAS backend (M9b): the `aws` feature only — no azure/gcp/http
# stores, no local-filesystem store (naatre keeps its own fs CAS). rustls
# (aws-lc-rs crypto) rides in via the feature; see s3.rs for the sync facade.
object_store = { version = "0.14", default-features = false, features = ["aws"] }
# The S3 store is sync-facing (BlobStore has no async); a small private
# current-thread runtime drives object_store's futures.
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
# Stream driving for object_store listings (already in the tree via
# object_store).
futures = "0.3"
# Postgres TLS (F1): rustls + ring only — native-tls/OpenSSL left the
# graph entirely (deny.toml [bans] keeps it out). tokio-postgres-rustls's
# MakeRustlsConnect implements MakeTlsConnect<Socket>, which the sync
# postgres::Config::connect accepts; the per-sslmode verifiers live in
# pg_tls.rs.
tokio-postgres-rustls = "0.13.0"
# ring EXPLICITLY: aws-lc-rs (object_store's S3 crypto) is in the graph
# too, so a process-default provider would be ambiguous — pg_tls.rs
# never relies on one.
rustls = { version = "0.23", features = ["ring"] }
# Platform roots (the system trust store) for verify-ca/verify-full.
rustls-native-certs = "0.8"
# sslrootcert PEM parsing; PEM support ships with `std` on 1.x (there is
# no separate `pem` feature).
rustls-pki-types = { version = "1", features = ["std"] }

[dev-dependencies]
tempfile = "3"
# SigV4 signing for the test harness's CreateBucket call (the S3 legs run
# against a REAL server; see tests/s3_provision).
hmac = "0.12"
sha2 = "0.10"
# One CreateBucket + health poll per test server; object_store already
# brings reqwest+rustls into the tree, this only names it for the harness.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "blocking"] }
# F1 TLS pins: the test CA + server certs the pg_tls verifiers are
# called with are generated here (tests/pg_tls_test.rs — no network, no
# live Postgres).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
