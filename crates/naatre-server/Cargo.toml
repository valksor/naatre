[package]
name = "naatre-server"
description = "naatre server: axum HTTP API over the store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
naatre-core = { path = "../naatre-core" }
naatre-store = { path = "../naatre-store" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "5"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
# Git import reads local repositories only: no network features, no worktree
# machinery — the minimal facade over object/ref access (sha1 object ids).
gix = { version = "0.90", default-features = false, features = ["sha1"] }
# Line-level 3-way merge (plan "Merge": UTF-8 text only; binary both-modified
# is a structured conflict, never a garbage merge).
similar = "2"
blake3 = "1"
getrandom = "0.3"
base64 = "0.22"
# Backup-artifact integrity (M11): the manifest carries the SHA256 of
# every artifact and restore verifies it before touching the target. The
# same crate/version the workspace already resolves (the test harnesses
# pin it) — no new external code enters the lockfile.
sha2 = "0.10"
# Origin-signed cache tickets (M13b): Ed25519 sign/verify via
# `ring::signature`. ring is ALREADY in the dependency graph (rustls and
# quinn-proto ride object_store's aws feature in naatre-store), so this
# direct dependency adds zero new crates to Cargo.lock — the M13b
# dependency decision over ed25519-dalek (which would add five).
ring = "0.17"
# The cache tier's origin client (M13b): the same blocking client and
# version pin the CLI's verbs use — no new external crate (ureq is
# naatre-cli's pinned HTTP client already). F1: the rustls connector so an
# https origin works (platform roots; the tier has no ca_file flag).
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
# The explicit ring crypto provider for ureq's rustls connector (both ring
# and aws-lc-rs sit in the graph, so a process default would be ambiguous —
# the same rule naatre-store's TLS follows) and the platform root store.
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"

[dev-dependencies]
tempfile = "3"
# ServiceExt::oneshot drives the router in tests without a socket.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Raw-socket HTTP client in the shutdown test.
tokio = { version = "1", features = ["io-util"] }
# Structured-mutation fuzzing of the canonical decoder (already pinned by
# naatre-core's dev-deps — no new external crate).
proptest = "1"
# The M9b S3 harness (m9_s3_test) includes naatre-store's s3_provision
# module by path: its SigV4 bootstrap and sha256 pins need these here too.
sha2 = "0.10"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "blocking"] }
