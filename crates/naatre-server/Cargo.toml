[package]
name = "naatre-server"
description = "naatre server: axum HTTP API over the store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
naatre-core = { path = "../naatre-core" }
naatre-store = { path = "../naatre-store" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "macros", "sync"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "5"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
# ServiceExt::oneshot drives the router in tests without a socket.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# Raw-socket HTTP client in the shutdown test.
tokio = { version = "1", features = ["io-util"] }
