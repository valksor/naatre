[package]
name = "naatre-cli"
description = "naatre CLI: host-local admin verbs (init, serve, token) and thin HTTP client verbs (binary: naatre)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "naatre_cli"
path = "src/lib.rs"

[[bin]]
name = "naatre"
path = "src/main.rs"

[dependencies]
naatre-core = { path = "../naatre-core" }
naatre-server = { path = "../naatre-server" }
naatre-store = { path = "../naatre-store" }
clap = { version = "4", features = ["derive"] }
# CSPRNG snapshot ids (`naatre snapshot` generates the 64-hex id client-side;
# same crate the server pins — no new external dependency).
getrandom = "0.3"
# HTTP client (F1: rustls + platform roots — https works everywhere, plain
# http stays loopback/opt-in; no native-tls/OpenSSL, kept out by deny.toml).
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
# The explicit ring crypto provider for ureq's rustls connector (both ring
# and aws-lc-rs sit in the graph, so a process default would be ambiguous —
# the same rule naatre-store's TLS follows) and the platform root store.
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# NFC normalization of disk paths before index comparison (same crate the
# core grammar uses; already pinned in the workspace lockfile).
unicode-normalization = "0.1"
# Batch object fetches return base64 payloads (same version naatre-server
# pins; already in the workspace lockfile).
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# Working-copy flock (`.naatre/wc.lock`): `naatre mcp` holds it for the
# session, CLI working-copy verbs per invocation — the same crate and pin
# naatre-store uses for the data-dir flock (already in the lockfile).
fs2 = "0.4"
# NFSv3 front-end for `naatre mount` (M8): userspace server, one loopback
# port carrying the nfs + mount + portmap programs. BSD-3-Clause; GPL-3
# compatible (license re-verified in the M8a dependency table).
nfsserve = "0.11"
# The nfsserve `NFSFileSystem` trait is async; the naatre adapter implements
# it over the sync VFS (already in the lockfile via naatre-server's axum).
async-trait = "0.1"
# Stale-mount-dir cleanup (`kill(pid, 0)` liveness) for the per-mount cache
# dirs (already in the lockfile via getrandom).
libc = "0.2"
constant_time_eq = "0.3"

# FUSE front-end for `naatre mount --fuse` (M8b, Linux-only target): the
# adapter lives behind `#[cfg(target_os = "linux")]`, so this dep never
# compiles on macOS. Pure-Rust FUSE client (no libfuse at build time; it
# shells out to fusermount3 to mount/unmount, which the front-end's docs
# name). MIT; GPL-3 compatible (re-verified in the M8b dependency table).
[target.'cfg(target_os = "linux")'.dependencies]
fuser = "0.18"

[dev-dependencies]
tempfile = "3"
# Direct-DB seeding of the `main` ref row (land, its only writer, is M4) —
# the same technique the naatre-server M2a tests use.
rusqlite = { version = "0.41", features = ["bundled"] }
# Local rustls TLS server for the ca_file handshake pin (F1 test 13a):
# rcgen CA + leaf, `rustls::ServerConnection` over a loopback listener.
# Same crate and pin naatre-store's TLS tests use (already in the lock).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
