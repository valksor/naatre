[package]
name = "naatre-core"
description = "naatre core: object ids, canonical encodings, path grammar, validation (pure, no I/O)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1"
unicode-normalization = "0.1"
thiserror = "2"

[dev-dependencies]
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
