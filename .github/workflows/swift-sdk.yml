name: Swift SDK

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: self-data
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify self-data runner prerequisites
        run: bash scripts/check-self-data-runner.sh swift
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
      - name: Verify Swift generator
        run: go test ./sdk/swift/sdkgen ./cmd/naatre-swift-sdk-generator
      - name: Reproduce Swift bindings
        run: go generate ./sdk/swift && git diff --exit-code -- sdk/swift/Sources/NaatreGenerated
      - name: Build Swift package
        run: swift build --package-path sdk/swift --product naatre-swift-conformance
      - name: Swift client conformance
        run: swift run --package-path sdk/swift naatre-swift-conformance
