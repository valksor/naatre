name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      # Regenerate the checked OpenAPI artifact through the same render the
      # served route uses, then diff it against the committed file
      # (plan "API conventions": "CI regenerates and diffs").
      - run: |
          NAATRE_UPDATE_OPENAPI=1 cargo test -p naatre-server --test openapi_artifact_test --locked
          git diff --exit-code docs/openapi.json

  coldboot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Clean-dir cold boot (plan M5 check): init → serve → token+URL →
      # repo create → clone from a second directory → commit → land →
      # snapshot → restore into a third dir. Must pass, no allow-failure.
      - run: cargo build --locked
      - run: scripts/coldboot.sh target/debug/naatre

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: licenses advisories

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      # No binaries exist yet at M0, so the glob may match nothing; this job
      # exists to prove the static musl build path early.
      - run: sha256sum target/x86_64-unknown-linux-musl/release/naatre* > SHA256SUMS || true
      # THIRD_PARTY_LICENSES.md ships in the release artifacts (plan
      # "License": "in release + Docker"); it is the Cargo.lock-derived
      # approximation until a release step regenerates it with cargo-about.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-checksums
          path: |
            SHA256SUMS
            THIRD_PARTY_LICENSES.md
