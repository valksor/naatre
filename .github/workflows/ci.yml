name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.425
            10.0.401
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.3
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Unit tests
        run: go test ./...
      - name: SDK and independent conformance
        run: |
          npm --prefix sdk/typescript ci --ignore-scripts
          npm --prefix sdk/typescript test
          npm --prefix sdk/typescript run typecheck
          node conformance/independent/scalars.mjs
          node conformance/independent/canonical.mjs
          node conformance/independent/http-digest.mjs
          node conformance/independent/reliability.mjs
          node conformance/independent/profiles.mjs
          node conformance/independent/verify-typescript-sdk.mjs
          node conformance/independent/verify-typescript-adapters.mjs
          printf '%s\n' '{"protocol":"naatre.conformance.runner-1","id":"ci","command":"run","path":{"source":{"kind":"codec","language":"javascript-typescript"},"destination":{"kind":"codec","language":"javascript-typescript"}},"profiles":["suite.contract-1","core.scalar.c14n-1","core.interop.c14n-1","core.http.digest-1"]}' | node conformance/independent/runner.mjs --require-pass
          printf '%s\n' '{"protocol":"naatre.conformance.runner-1","id":"sdk","command":"run","path":{"source":{"kind":"sdk","language":"javascript-typescript"},"destination":{"kind":"native-runtime","language":"javascript-typescript"}},"profiles":["sdk.typescript.core-1","sdk.typescript.adapters-1"]}' | node conformance/independent/runner.mjs --require-pass
          ./sdk/rust/ci.sh
      - name: Dart SDK conformance
        run: |
          node conformance/independent/verify-dart-sdk.mjs
          printf '%s\n' '{"protocol":"naatre.conformance.runner-1","id":"dart","command":"run","path":{"source":{"kind":"sdk","language":"dart"},"destination":{"kind":"native-runtime","language":"dart"}},"profiles":["sdk.dart.core-1"]}' | node conformance/independent/runner.mjs --require-pass
      - name: Ruby SDK conformance
        run: |
          ruby --version
          ruby sdk/ruby/sdkgen/cli.rb
          ruby -Isdk/ruby/lib -Isdk/ruby/test -e 'Dir["sdk/ruby/test/**/*_test.rb"].sort.each { |file| require File.expand_path(file) }'
          node conformance/independent/verify-ruby-sdk.mjs
          printf '%s\n' '{"protocol":"naatre.conformance.runner-1","id":"ruby","command":"run","path":{"source":{"kind":"sdk","language":"ruby"},"destination":{"kind":"native-runtime","language":"ruby"}},"profiles":["sdk.ruby.core-1"]}' | node conformance/independent/runner.mjs --require-pass
      - name: Go conformance runner
        run: printf '%s\n' '{"protocol":"naatre.conformance.runner-1","id":"ci","command":"run","path":{"source":{"kind":"sdk","language":"go"},"destination":{"kind":"native-runtime","language":"go"}},"profiles":["suite.contract-1"]}' | go run ./cmd/naatre-conformance --require-pass
      - name: .NET SDK conformance
        run: |
          node conformance/independent/verify-dotnet-sdk.mjs
          printf '%s\n' '{"protocol":"naatre.conformance.runner-1","id":"dotnet","command":"run","path":{"source":{"kind":"sdk","language":"dotnet"},"destination":{"kind":"native-runtime","language":"dotnet"}},"profiles":["sdk.dotnet.core-1"]}' | node conformance/independent/runner.mjs --require-pass
        run: printf '%s\n' '{"protocol":"naatre.conformance.runner-1","id":"ci","command":"run","path":{"source":{"kind":"sdk","language":"go"},"destination":{"kind":"native-runtime","language":"go"}},"profiles":["suite.contract-1","runtime.go.plan-cache-1"]}' | go run ./cmd/naatre-conformance --require-pass
      - name: Core parallel and cancellation race fixtures
        run: go test -race ./internal/conformance -run 'TestGoRunnerParallelCancellationProfile' -count=1
      - name: Race tests
        run: go test -race ./...
        run: printf '%s\n' '{"protocol":"naatre.conformance.runner-1","id":"ci","command":"run","path":{"source":{"kind":"sdk","language":"go"},"destination":{"kind":"native-runtime","language":"go"}},"profiles":["suite.contract-1","quality.go.harness-1"]}' | go run ./cmd/naatre-conformance --require-pass
      - name: Go quality harnesses
        run: bash conformance/run-go-quality-ci.sh
      - name: Vet
        run: go vet ./...
      - name: Static analysis
        uses: golangci/golangci-lint-action@db9de0fc1a667e1a49d2291a1a042dff081d78f6 # v9
        with:
          version: v2.12.2
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Reproducible generated files
        run: go generate ./... && git diff --exit-code

  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          - os: macos-15
            goos: darwin
            goarch: arm64
          - os: windows-2025
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
      - name: Test portable packages
        shell: bash
        run: go test ./protocol ./schema ./runtime

  runtime-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
      - run: go test ./runtime
      - run: go test -race ./runtime
