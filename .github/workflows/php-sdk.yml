name: PHP SDK

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: composer --working-dir=sdk/php install --no-interaction --prefer-dist
      - name: Verify SDK
        run: |
          composer --working-dir=sdk/php check
          node conformance/independent/verify-php-sdk.mjs
          node conformance/independent/verify-php-adapters.mjs
          git diff --exit-code -- sdk/php/generated
