name: PHP SDK

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    runs-on: self-data
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify self-data runner
        run: bash scripts/check-self-data-runner.sh
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.21.0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: composer --working-dir=sdk/php install --no-interaction --prefer-dist
      - name: Verify SDK
        run: |
          composer --working-dir=sdk/php check
          node conformance/independent/verify-php-sdk.mjs
          node conformance/independent/verify-php-adapters.mjs
          php examples/v1/workers/php.php
          node conformance/independent/verify-php-server.mjs
          node conformance/independent/verify-php-worker-adapters.mjs
          git diff --exit-code -- sdk/php/generated
